spring.application.name=scormvalidator

server.port=7001

# Cassandra
spring.cassandra.local-datacenter=DC1
cassandra.config.host=localhost
sunbird_cassandra_consistency_level=ONE

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
kafka.scorm.validation.request.topic=scorm.validation.request
kafka.scorm.validation.request.topic.group=scormvalidator

# SSO / Keycloak (JWT verification)
sso.url=https://portal.dev.karmayogibharat.net/auth/
sso.realm=sunbird
accesstoken.publickey.basepath=/home/Publickey

# Cloud storage
cloud.storage.type.name=azure
cloud.storage.key=igot
cloud.storage.secret=cloudStorageKey
cloud.storage.endpoint=endpoint
cloud.container.name=sb-cb-ext
scorm.validation.container.name=igot

# Content Service (read content metadata, incl. artifactUrl, by resourceId)
content-service-host=http://content-service:9000/
content-read-endpoint=content/v4/admin/read
