spring.application.name=scormvalidator

spring.cassandra.local-datacenter=DC1
cassandra.config.host=localhost
sunbird_cassandra_consistency_level=ONE

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.request.timeout.ms=2000
kafka.scorm.validation.request.topic=scorm.validation.requested
kafka.scorm.validation.request.topic.group=scormvalidator

sso.url=https://example.com/auth/
sso.realm=test-realm
accesstoken.publickey.basepath=/tmp

cloud.storage.type.name=azure
cloud.storage.key=test
cloud.storage.secret=test
cloud.storage.endpoint=test
cloud.container.name=test-container
scorm.validation.container.name=scormvalidation
scorm.validation.supported.mime-types=application/vnd.ekstep.html-archive

content-service-host=http://localhost:9999/
content-read-endpoint=content/v4/admin/read
